[package]
name = "wp-mini"
version = "0.2.0-alpha.3"
edition = "2024"
description = "Minimal async API Wrapper for WP | Only Reader/Public API | Extremely minimal."
license = "AGPL-3.0-only"
documentation = "https://docs.rs/wp-mini"
homepage = "https://wprs.dev/mini"
repository = "https://github.com/WattDownload/crate-wp-mini"
authors = ["ZhiFenBL"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.11.0"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.17"

[package]
name = "wp-mini"
version = "0.2.0-alpha.3"
edition = "2024"
description = "Minimal async API Wrapper for WP | Only Reader/Public API | Extremely minimal."
license = "AGPL-3.0-only"
documentation = "https://docs.rs/wp-mini"
homepage = "https://wprs.dev/mini"
repository = "https://github.com/WattDownload/crate-wp-mini"
authors = ["ZhiFenBL"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.11.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "cookies", "rustls", "http2", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
